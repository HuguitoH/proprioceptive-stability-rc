; Firmware for the 1:10 test vehicle (ESP32-S3).
;
;   pio run -e esp32s3 -t upload      build and flash the car
;   pio device monitor                serial output
;   pio test -e native                unit tests of lib/core on the laptop
;
; Library versions are pinned so a build in May gives the same binary as one
; in October.

[platformio]
default_envs = esp32s3

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

; - The car
[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; upload_port is detected automatically. To force one locally, use
; `pio run -t upload --upload-port COM5` instead of committing it here.

; 16 MB flash and 8 MB octal PSRAM on this board
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.6
    adafruit/Adafruit BusIO @ 1.16.1
    madhephaestus/ESP32Servo @ 3.0.5

; - Unit tests on the laptop
; Only lib/core is compiled here: it must never include Arduino headers.
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
