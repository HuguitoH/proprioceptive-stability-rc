# Impact = likelihood (1-3) x consequence (1-5), Dawson (2015).
risks:
  - risk: "Scope creep, with time going into extras such as dashboard polish, the AI layer or new sensors"
    type: Non-technical, evolving
    likelihood: 3
    consequence: 4
    strategy: Avoidance
    mitigation: "Scope priorities fixed in Figure~\\ref{fig:mvp}, with S1--S2 outside the baseline. New ideas go to a list in the project diary. Any change of scope needs the supervisor's agreement and is recorded in Appendix~C."
    trigger: Hours spent on work outside the baseline while a primary milestone slips.
  - risk: Writing takes longer than estimated
    type: Non-technical, evolving
    likelihood: 3
    consequence: 4
    strategy: Avoidance
    mitigation: "Chapters are written from February onwards, alongside the experiments, and each one is a separate task. The literature review and methods build on the approved proposal."
    trigger: A chapter not drafted by the end of its planned week.
  - risk: Deadlines from the other four modules
    type: Non-technical, evolving
    likelihood: 3
    consequence: 3
    strategy: Contingency
    mitigation: "Fixed weekly time slots for this project. Coursework deadlines are marked in the diary in advance. The 20\\,\\% contingency absorbs busy weeks."
    trigger: Two weeks in a row with fewer than 10\,h on the project.
  - risk: Confirmed poster or submission date earlier than planned
    type: Non-technical, event-driven
    likelihood: 2
    consequence: 4
    strategy: Contingency
    mitigation: "Both dates are parameters of the planner, so the plan is regenerated the day they are confirmed. Before the poster, the build, validation and tuning keep priority over everything else, and the poster can fall back on the sensor validation and the open-loop step-steer results."
    trigger: Dates published by the module that differ from weeks 13 and 31.
  - risk: Slow progress in the build phase
    type: Non-technical, evolving
    likelihood: 2
    consequence: 4
    strategy: Avoidance
    mitigation: "The firmware, the unit tests and the PI controller (2.5, 2.6, 4.1) are developed on the laptop in parallel, so a slow build does not stop the software work."
    trigger: M1 not reached in week~7.
  - risk: Experimental sessions have to be repeated
    type: Technical, evolving
    likelihood: 2
    consequence: 4
    strategy: Contingency
    mitigation: "Slack after the sessions plus reserve hours. Conditions are alternated within each session. The secondary objectives are dropped first."
    trigger: Session A not finished in its planned week.
  - risk: Component failure or damage in a crash
    type: Technical, event-driven
    likelihood: 2
    consequence: 4
    strategy: Contingency
    mitigation: "A spare ESP32-S3 and a spare IMU are available. Bench tests with the wheels lifted come first, and the hardware is not changed between sessions."
    trigger: Intermittent readings or sensor-health warnings.
  - risk: Sensor noise or vibration too high for control
    type: Technical, evolving
    likelihood: 2
    consequence: 4
    strategy: Avoidance
    mitigation: "The sensors are characterised early (O1). The IMU is mounted rigidly and filtered in software, and it is only replaced if the data justify it."
    trigger: Vibration peaks inside the control band, or high gyroscope bias instability.
  - risk: The controller cannot be tuned to a stable loop
    type: Technical, evolving
    likelihood: 2
    consequence: 4
    strategy: Avoidance
    mitigation: "The yaw response is identified before tuning, and the gains start conservative, with a P-only fallback. A negative result still answers the research question."
    trigger: Oscillation or saturation in the step-steer tests.
  - risk: Rain prevents the outdoor session
    type: Non-technical, event-driven
    likelihood: 2
    consequence: 3
    strategy: Contingency
    mitigation: "Session C is replaced by an indoor high-grip surface whose friction is measured with the same pull test. H2 is tested against measured friction, so three friction levels are kept. The change is recorded in Appendix~C."
    trigger: Rain forecast for the planned week.
  - risk: Purchase of the remaining parts delayed
    type: Non-technical, event-driven
    likelihood: 2
    consequence: 3
    strategy: Contingency
    mitigation: The parts are low-cost. Firmware, tests and simulation continue without them.
    trigger: Parts not ordered by the end of October.
  - risk: Loss of control or collision during testing
    type: Technical, event-driven
    likelihood: 2
    consequence: 3
    strategy: Avoidance
    mitigation: "Firmware speed limit, automatic stop if the link is lost, soft barriers indoors and outdoor tests only in empty areas."
    trigger: Any near miss during a session.
  - risk: Ground-truth tracking not accurate enough
    type: Technical, evolving
    likelihood: 2
    consequence: 3
    strategy: Avoidance
    mitigation: "The rig is checked against measured floor points before the first session. If it fails, the path is measured against tape markers on the floor."
    trigger: Position error of more than a few centimetres at the floor points.
  - risk: Data loss (laptop or microSD failure)
    type: Technical, event-driven
    likelihood: 1
    consequence: 5
    strategy: Contingency
    mitigation: "Code and logs are pushed to the repository after every session, and raw logs are also copied to cloud storage on the same day."
    trigger: Data more than one day old that exists in only one place.
  - risk: Illness or personal emergency
    type: Non-technical, event-driven
    likelihood: 1
    consequence: 4
    strategy: Contingency
    mitigation: "The 20\\,\\% contingency, and the university's extenuating-circumstances procedure if more time is lost."
    trigger: More than one week lost.
  - risk: Feedback on a submitted task requires rework
    type: Non-technical, event-driven
    likelihood: 2
    consequence: 2
    strategy: Contingency
    mitigation: "Tasks set by the supervisor are submitted on time, so that feedback arrives before the next step depends on it. Rework comes out of the reserve hours."
    trigger: Feedback that changes an earlier decision.

