# Baseline project plan: single source of truth.
# Estimates are three-point (PERT) in hours: [optimistic, most likely, pessimistic].
# `weeks` is the planned duration, `after` lists the tasks that must finish first.

config:
  module_start: 2026-09-23          # first session of the module (Wednesday)
  start: 2026-10-19                 # Monday of planning week 1
  weeks: 31                         # week 31 ends on Sunday 23 May 2027
  hours_per_week: 14
  christmas_weeks: [10, 11]         # planned at half capacity
  contingency: 0.20                 # Dawson (2015): set aside 20 % of the time available
  weekly_loading: 0.90              # no week is planned above 90 % of its hours
  poster_week: 13                   # provisional, January assessment period
  submission_week: 31               # provisional, to be confirmed by the module
  repository: https://github.com/HuguitoH/proprioceptive-stability-rc
  class_days: [2026-10-21, 2026-11-11, 2026-11-18, 2026-11-25, 2026-12-09, 2027-01-13]

work_packages:
  "1": Project management
  "2": Platform build
  "3": O1 Sensor validation
  "4": O2 Controller
  "5": Poster
  "6": O4 Safety layer
  "7": O3 Experiments
  "8": O5 Dataset
  "9": Dissertation
  "10": S1--S2 (secondary)

