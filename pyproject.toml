[project]
name = "proprioceptive-stability-rc"
version = "0.1.0"
description = "Low-cost proprioceptive stability control for a 1:10-scale vehicle: planner, analysis and tools"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hugo Hernández Moreno" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
